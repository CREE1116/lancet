<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 742" width="920" height="742" role="img" aria-labelledby="title desc">
<title id="title">Full workload profile: where the index wins and where it ties</title>
<desc id="desc">Literal anchors deliver 2–786× speedups; literal-free regex &amp; AST fall back to full scan / full parse.</desc>
