<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 392" width="920" height="392" role="img" aria-labelledby="title desc">
<title id="title">How an indexed query skips 91% of the work and stays exact</title>
<desc id="desc">Linux v6.12 · 86,218 files · query "spin_lock" (auto mode)</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.num{font-variant-numeric:tabular-nums}
.panel{fill:#fbfbfa;stroke:rgba(27,31,36,.12)}
.card{fill:#ffffff;stroke:#d0d7de}
.pill{fill:#f6f8fa;stroke:#d0d7de}
.hl{fill:#eff6ff;stroke:#2563eb}
.hlwarn{fill:#fffbeb;stroke:#d97706}
.ink{fill:#1f2328}.ink2{fill:#59636e}.mut{fill:#7d8590}
.grid{stroke:#eaeef2}.axis{stroke:#afb8c1}.div{stroke:#d8dee4}
.flow{stroke:#8c959f;fill:none}.flowacc{stroke:#2563eb;fill:none}
.head{fill:#8c959f}.headacc{fill:#2563eb}
.base{fill:#94a3b8}.auto{fill:#2563eb}.trust{fill:#0d9488}
.zoekt{fill:#d97706;stroke:#ffffff;stroke-width:1.4}
.warn{fill:#d97706}.bad{fill:#cf222e}.good{fill:#1a7f37}
.badsoft{fill:#ffebe9;stroke:#ff8182}.goodsoft{fill:#dafbe1;stroke:#4ac26b}
.track{fill:#eaeef2}
.f0{fill:#dbeafe}.f1{fill:#60a5fa}.f2{fill:#1d4ed8}
.cblue{fill:#2563eb}.cteal{fill:#0d9488}.cwarn{fill:#d97706}.cbad{fill:#cf222e}.cgood{fill:#1a7f37}
@media (prefers-color-scheme: dark){
.panel{fill:#0d1117;stroke:rgba(240,246,252,.12)}
.card{fill:#161b22;stroke:#30363d}
.pill{fill:#21262d;stroke:#30363d}
.hl{fill:#13233a;stroke:#58a6ff}
.hlwarn{fill:#271f12;stroke:#f59e0b}
.ink{fill:#f0f6fc}.ink2{fill:#9da7b3}.mut{fill:#7d8590}
.grid{stroke:#21262d}.axis{stroke:#484f58}.div{stroke:#30363d}
.flow{stroke:#6e7681}.flowacc{stroke:#58a6ff}
.head{fill:#6e7681}.headacc{fill:#58a6ff}
.base{fill:#6e7681}.auto{fill:#58a6ff}.trust{fill:#2dd4bf}
.zoekt{fill:#f59e0b;stroke:#161b22;stroke-width:1.4}
.warn{fill:#f59e0b}.bad{fill:#ff7b72}.good{fill:#3fb950}
.badsoft{fill:#311618;stroke:#f85149}.goodsoft{fill:#12261e;stroke:#2ea043}
.track{fill:#21262d}
.f0{fill:#172b44}.f1{fill:#2f81f7}.f2{fill:#79c0ff}
.cblue{fill:#58a6ff}.cteal{fill:#2dd4bf}.cwarn{fill:#f59e0b}.cbad{fill:#ff7b72}.cgood{fill:#3fb950}
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head" d="M0,1 L10,5 L0,9 z"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="headacc" d="M0,1 L10,5 L0,9 z"/></marker>
</defs>
<rect class="panel" x="0.5" y="0.5" width="919" height="391" rx="12"/>
<text x="28.0" y="36.0" class="ink" font-size="17.5" text-anchor="start" font-weight="700">How an indexed query skips 91% of the work and stays exact</text>
<text x="28.0" y="58.0" class="ink2" font-size="12.5" text-anchor="start">Linux v6.12 · 86,218 files · query "spin_lock" (auto mode)</text>
<rect class="card" x="28.0" y="82.0" width="201.0" height="112.0" rx="9"/>
<text x="42.0" y="109.0" class="ink" font-size="14" text-anchor="start" font-weight="700">1  Compile</text>
<text x="42.0" y="134.0" class="ink2" font-size="12" text-anchor="start">"spin_lock" → required</text>
<text x="42.0" y="153.0" class="ink2" font-size="12" text-anchor="start">trigrams: spi ∧ pin ∧ …</text>
<text x="42.0" y="172.0" class="ink2" font-size="12" text-anchor="start">∧ ock (sound lower bound)</text>
<path class="flow" stroke-width="1.6" d="M232.0,138.0 L246.0,138.0" marker-end="url(#ah)"/>
<rect class="card" x="249.0" y="82.0" width="201.0" height="112.0" rx="9"/>
<text x="263.0" y="109.0" class="ink" font-size="14" text-anchor="start" font-weight="700">2  Intersect</text>
<text x="263.0" y="134.0" class="ink2" font-size="12" text-anchor="start">mmap'd .lancet segments</text>
<text x="263.0" y="153.0" class="ink2" font-size="12" text-anchor="start">posting lists, rarest first</text>
<text x="263.0" y="172.0" class="ink2" font-size="12" text-anchor="start">→ candidate files</text>
<path class="flow" stroke-width="1.6" d="M453.0,138.0 L467.0,138.0" marker-end="url(#ah)"/>
<rect class="card" x="470.0" y="82.0" width="201.0" height="112.0" rx="9"/>
<text x="484.0" y="109.0" class="ink" font-size="14" text-anchor="start" font-weight="700">3  Freshness</text>
<text x="484.0" y="134.0" class="ink2" font-size="12" text-anchor="start">mtime·size·ctime·inode</text>
<text x="484.0" y="153.0" class="ink2" font-size="12" text-anchor="start">changed? scan live,</text>
<text x="484.0" y="172.0" class="ink2" font-size="12" text-anchor="start">no daemon, no reindex</text>
<path class="flow" stroke-width="1.6" d="M674.0,138.0 L688.0,138.0" marker-end="url(#ah)"/>
<rect class="hl" x="691.0" y="82.0" width="201.0" height="112.0" rx="9"/>
<text x="705.0" y="109.0" class="cblue" font-size="14" text-anchor="start" font-weight="700">4  Verify</text>
<text x="705.0" y="134.0" class="ink2" font-size="12" text-anchor="start">same exact evaluator</text>
<text x="705.0" y="153.0" class="ink2" font-size="12" text-anchor="start">as a full scan runs on</text>
<text x="705.0" y="172.0" class="ink2" font-size="12" text-anchor="start">every surviving file</text>
<rect class="f0" x="28" y="228" width="530.0" height="26" rx="4"/>
<text x="570.0" y="246.0" class="ink num" font-size="14" text-anchor="start" font-weight="700">86,218</text>
<text x="638.0" y="246.0" class="ink2" font-size="12.5" text-anchor="start">files in the repository</text>
<rect class="f1" x="28" y="266" width="48.0" height="26" rx="4"/>
<text x="88.0" y="284.0" class="ink num" font-size="14" text-anchor="start" font-weight="700">7,814</text>
<text x="156.0" y="284.0" class="ink2" font-size="12.5" text-anchor="start">opened and verified (9.1%)</text>
<rect class="f2" x="28" y="304" width="43.5" height="26" rx="4"/>
<text x="83.5" y="322.0" class="ink num" font-size="14" text-anchor="start" font-weight="700">7,073</text>
<text x="151.5" y="322.0" class="ink2" font-size="12.5" text-anchor="start">matching files (8.2%)</text>
<text x="28.0" y="376.0" class="mut" font-size="12" text-anchor="start">Result is byte-for-byte identical to a full scan — the index only decides what not to open.</text>
</svg>
