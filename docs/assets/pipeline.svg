<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="title desc">
<title id="title">Indexed query pipeline</title>
<desc id="desc">Query compiled to required trigrams, intersected over the index, stale files rescanned, all candidates verified by the full-scan evaluator: 86,218 files, 7,814 opened, 7,073 matches.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.panel{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
.card{fill:#ffffff;stroke:#c3c2b7}
.hl{fill:#eef5fd;stroke:#2a78d6}
.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}
.flow{stroke:#898781;fill:none}.flowacc{stroke:#2a78d6;fill:none}
.head{fill:#898781}.headacc{fill:#2a78d6}
.base{fill:#a3a19a}.auto{fill:#2a78d6}.trust{fill:#104281}
.f0{fill:#cde2fb}.f1{fill:#6da7ec}.f2{fill:#1c5cab}
.accent{fill:#2a78d6}.good{fill:#006300}
@media (prefers-color-scheme: dark){
.panel{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
.card{fill:#222220;stroke:#383835}
.hl{fill:#16263a;stroke:#3987e5}
.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.mut{fill:#898781}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}
.flow{stroke:#898781}.flowacc{stroke:#3987e5}
.head{fill:#898781}.headacc{fill:#3987e5}
.base{fill:#6b6a65}.auto{fill:#3987e5}.trust{fill:#9ec5f4}
.f0{fill:#1c3350}.f1{fill:#256abf}.f2{fill:#9ec5f4}
.accent{fill:#3987e5}.good{fill:#0ca30c}
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,1 L10,5 L0,9 z"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headacc" d="M0,1 L10,5 L0,9 z"/></marker>
</defs>
<rect class="panel" x="0.5" y="0.5" width="879" height="379" rx="12"/>
<text x="28" y="40" class="ink" font-size="17" text-anchor="start" font-weight="600">How an indexed query skips 91% of the work and stays exact</text>
<text x="28" y="62" class="ink2" font-size="13" text-anchor="start">Linux v6.12 · 86,218 files · query "spin_lock" (auto mode)</text>
<rect class="card" x="28" y="86" width="190" height="106" rx="8"/>
<text x="42" y="112" class="ink" font-size="14" text-anchor="start" font-weight="600">1  Compile</text>
<text x="42" y="136" class="ink2" font-size="12" text-anchor="start">"spin_lock"  →  required</text>
<text x="42" y="154" class="ink2" font-size="12" text-anchor="start">trigrams: spi ∧ pin ∧ …</text>
<text x="42" y="172" class="ink2" font-size="12" text-anchor="start">∧ ock  (sound lower bound)</text>
<path class="flow" stroke-width="1.6" d="M221,139.0 L237,139.0" marker-end="url(#ah)"/>
<rect class="card" x="240" y="86" width="190" height="106" rx="8"/>
<text x="254" y="112" class="ink" font-size="14" text-anchor="start" font-weight="600">2  Intersect</text>
<text x="254" y="136" class="ink2" font-size="12" text-anchor="start">mmap'd .lancet segments</text>
<text x="254" y="154" class="ink2" font-size="12" text-anchor="start">posting lists, rarest first</text>
<text x="254" y="172" class="ink2" font-size="12" text-anchor="start">→ candidate files</text>
<path class="flow" stroke-width="1.6" d="M433,139.0 L449,139.0" marker-end="url(#ah)"/>
<rect class="card" x="452" y="86" width="190" height="106" rx="8"/>
<text x="466" y="112" class="ink" font-size="14" text-anchor="start" font-weight="600">3  Freshness</text>
<text x="466" y="136" class="ink2" font-size="12" text-anchor="start">disk (mtime, size) ≠ index?</text>
<text x="466" y="154" class="ink2" font-size="12" text-anchor="start">→ scan that file live,</text>
<text x="466" y="172" class="ink2" font-size="12" text-anchor="start">no daemon, no reindex</text>
<path class="flow" stroke-width="1.6" d="M645,139.0 L661,139.0" marker-end="url(#ah)"/>
<rect class="hl" x="664" y="86" width="190" height="106" rx="8"/>
<text x="678" y="112" class="ink" font-size="14" text-anchor="start" font-weight="600">4  Verify</text>
<text x="678" y="136" class="ink2" font-size="12" text-anchor="start">same exact evaluator</text>
<text x="678" y="154" class="ink2" font-size="12" text-anchor="start">as a full scan runs on</text>
<text x="678" y="172" class="ink2" font-size="12" text-anchor="start">every surviving file</text>
<rect class="f0" x="28" y="232" width="624.0" height="26" rx="4"/>
<text x="664.0" y="250" class="ink" font-size="14" text-anchor="start" font-weight="600">86,218</text>
<text x="726.0" y="250" class="ink2" font-size="13" text-anchor="start">files in the repository</text>
<rect class="f1" x="28" y="270" width="56.6" height="26" rx="4"/>
<text x="96.55357349973323" y="288" class="ink" font-size="14" text-anchor="start" font-weight="600">7,814</text>
<text x="158.55357349973323" y="288" class="ink2" font-size="13" text-anchor="start">opened and verified (9.1%)</text>
<rect class="f2" x="28" y="308" width="51.2" height="26" rx="4"/>
<text x="91.19060984945139" y="326" class="ink" font-size="14" text-anchor="start" font-weight="600">7,073</text>
<text x="153.1906098494514" y="326" class="ink2" font-size="13" text-anchor="start">matching files</text>
<text x="28" y="362" class="mut" font-size="12" text-anchor="start">Result is byte-for-byte identical to a full scan — the index only decides what not to open.</text>
</svg>
