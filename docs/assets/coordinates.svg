<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-labelledby="title desc">
<title id="title">One coordinate system: find → read → change → find</title>
<desc id="desc">Every command shares paths, lines, AST spans and rev hashes, so steps chain without re-locating anything.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.num{font-variant-numeric:tabular-nums}
.panel{fill:#fbfbfa;stroke:rgba(27,31,36,.12)}
.card{fill:#ffffff;stroke:#d0d7de}
.pill{fill:#f6f8fa;stroke:#d0d7de}
.hl{fill:#eff6ff;stroke:#2563eb}
.hlwarn{fill:#fffbeb;stroke:#d97706}
.ink{fill:#1f2328}.ink2{fill:#59636e}.mut{fill:#7d8590}
.grid{stroke:#eaeef2}.axis{stroke:#afb8c1}.div{stroke:#d8dee4}
.flow{stroke:#8c959f;fill:none}.flowacc{stroke:#2563eb;fill:none}
.head{fill:#8c959f}.headacc{fill:#2563eb}
.base{fill:#94a3b8}.auto{fill:#2563eb}.trust{fill:#0d9488}
.zoekt{fill:#d97706;stroke:#ffffff;stroke-width:1.4}
.warn{fill:#d97706}.bad{fill:#cf222e}.good{fill:#1a7f37}
.badsoft{fill:#ffebe9;stroke:#ff8182}.goodsoft{fill:#dafbe1;stroke:#4ac26b}
.track{fill:#eaeef2}
.f0{fill:#dbeafe}.f1{fill:#60a5fa}.f2{fill:#1d4ed8}
.cblue{fill:#2563eb}.cteal{fill:#0d9488}.cwarn{fill:#d97706}.cbad{fill:#cf222e}.cgood{fill:#1a7f37}
@media (prefers-color-scheme: dark){
.panel{fill:#0d1117;stroke:rgba(240,246,252,.12)}
.card{fill:#161b22;stroke:#30363d}
.pill{fill:#21262d;stroke:#30363d}
.hl{fill:#13233a;stroke:#58a6ff}
.hlwarn{fill:#271f12;stroke:#f59e0b}
.ink{fill:#f0f6fc}.ink2{fill:#9da7b3}.mut{fill:#7d8590}
.grid{stroke:#21262d}.axis{stroke:#484f58}.div{stroke:#30363d}
.flow{stroke:#6e7681}.flowacc{stroke:#58a6ff}
.head{fill:#6e7681}.headacc{fill:#58a6ff}
.base{fill:#6e7681}.auto{fill:#58a6ff}.trust{fill:#2dd4bf}
.zoekt{fill:#f59e0b;stroke:#161b22;stroke-width:1.4}
.warn{fill:#f59e0b}.bad{fill:#ff7b72}.good{fill:#3fb950}
.badsoft{fill:#311618;stroke:#f85149}.goodsoft{fill:#12261e;stroke:#2ea043}
.track{fill:#21262d}
.f0{fill:#172b44}.f1{fill:#2f81f7}.f2{fill:#79c0ff}
.cblue{fill:#58a6ff}.cteal{fill:#2dd4bf}.cwarn{fill:#f59e0b}.cbad{fill:#ff7b72}.cgood{fill:#3fb950}
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head" d="M0,1 L10,5 L0,9 z"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="headacc" d="M0,1 L10,5 L0,9 z"/></marker>
</defs>
<rect class="panel" x="0.5" y="0.5" width="919" height="359" rx="12"/>
<text x="28.0" y="36.0" class="ink" font-size="17.5" text-anchor="start" font-weight="700">One coordinate system: find → read → change → find</text>
<text x="28.0" y="58.0" class="ink2" font-size="12.5" text-anchor="start">Every command shares paths, lines, AST spans and rev hashes, so steps chain without re-locating anything.</text>
<rect class="card" x="28.0" y="82.0" width="201.0" height="114.0" rx="9"/>
<text x="42.0" y="108.0" class="ink" font-size="13.5" text-anchor="start" font-weight="700">1  Find</text>
<text x="42.0" y="132.0" class="ink mono" font-size="11.5" text-anchor="start">lancet rg / query</text>
<text x="42.0" y="155.0" class="ink2" font-size="11.5" text-anchor="start">hit at</text>
<text x="42.0" y="173.0" class="ink2" font-size="11.5" text-anchor="start">src/search.rs:271</text>
<path class="flowacc" stroke-width="1.6" d="M232.0,139.0 L246.0,139.0" marker-end="url(#aha)"/>
<rect class="card" x="249.0" y="82.0" width="201.0" height="114.0" rx="9"/>
<text x="263.0" y="108.0" class="ink" font-size="13.5" text-anchor="start" font-weight="700">2  Read</text>
<text x="263.0" y="132.0" class="ink mono" font-size="11.5" text-anchor="start">lancet read --symbol</text>
<text x="263.0" y="155.0" class="ink2" font-size="11.5" text-anchor="start">--lines 260:300</text>
<text x="263.0" y="173.0" class="ink2" font-size="11.5" text-anchor="start">exact lines + rev hash</text>
<path class="flowacc" stroke-width="1.6" d="M453.0,139.0 L467.0,139.0" marker-end="url(#aha)"/>
<rect class="hl" x="470.0" y="82.0" width="201.0" height="114.0" rx="9"/>
<text x="484.0" y="108.0" class="cblue" font-size="13.5" text-anchor="start" font-weight="700">3  Change</text>
<text x="484.0" y="132.0" class="ink mono" font-size="11.5" text-anchor="start">edit --rev / patch / ast</text>
<text x="484.0" y="155.0" class="ink2" font-size="11.5" text-anchor="start">dry-run diff preview →</text>
<text x="484.0" y="173.0" class="ink2" font-size="11.5" text-anchor="start">--apply atomically</text>
<path class="flowacc" stroke-width="1.6" d="M674.0,139.0 L688.0,139.0" marker-end="url(#aha)"/>
<rect class="card" x="691.0" y="82.0" width="201.0" height="114.0" rx="9"/>
<text x="705.0" y="108.0" class="ink" font-size="13.5" text-anchor="start" font-weight="700">4  Find again</text>
<text x="705.0" y="132.0" class="ink mono" font-size="11.5" text-anchor="start">lancet 'execute_one'</text>
<text x="705.0" y="155.0" class="ink2" font-size="11.5" text-anchor="start">changed file auto-</text>
<text x="705.0" y="173.0" class="ink2" font-size="11.5" text-anchor="start">rescanned on next query</text>
<path class="flow" stroke-width="1.4" stroke-dasharray="4 4" fill="none" d="M791.5,200 C791.5,228 128.5,228 128.5,204" marker-end="url(#ah)"/>
<text x="460.0" y="243.0" class="mut" font-size="12" text-anchor="middle">no reindex step or background daemon in the loop</text>
<rect class="card" x="28.0" y="272.0" width="864.0" height="58.0" rx="9"/>
<text x="44.0" y="296.0" class="ink" font-size="13.5" text-anchor="start" font-weight="650">Same in-process extraction everywhere</text>
<text x="44.0" y="316.0" class="ink2" font-size="12" text-anchor="start">line 42 in search is line 42 in read — for .rs .py .ts …  .pdf .docx .pptx .xlsx .hwp .hwpx  bundle.zip!node.log</text>
</svg>
