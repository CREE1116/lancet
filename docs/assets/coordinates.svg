<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="title desc">
<title id="title">One coordinate system</title>
<desc id="desc">Search hits, read ranges, symbols and AST rewrites share coordinates; edited files are rescanned automatically on the next query.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.panel{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
.card{fill:#ffffff;stroke:#c3c2b7}
.hl{fill:#eef5fd;stroke:#2a78d6}
.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}
.flow{stroke:#898781;fill:none}.flowacc{stroke:#2a78d6;fill:none}
.head{fill:#898781}.headacc{fill:#2a78d6}
.base{fill:#a3a19a}.auto{fill:#2a78d6}.trust{fill:#104281}
.f0{fill:#cde2fb}.f1{fill:#6da7ec}.f2{fill:#1c5cab}
.accent{fill:#2a78d6}.good{fill:#006300}
@media (prefers-color-scheme: dark){
.panel{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
.card{fill:#222220;stroke:#383835}
.hl{fill:#16263a;stroke:#3987e5}
.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.mut{fill:#898781}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}
.flow{stroke:#898781}.flowacc{stroke:#3987e5}
.head{fill:#898781}.headacc{fill:#3987e5}
.base{fill:#6b6a65}.auto{fill:#3987e5}.trust{fill:#9ec5f4}
.f0{fill:#1c3350}.f1{fill:#256abf}.f2{fill:#9ec5f4}
.accent{fill:#3987e5}.good{fill:#0ca30c}
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,1 L10,5 L0,9 z"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headacc" d="M0,1 L10,5 L0,9 z"/></marker>
</defs>
<rect class="panel" x="0.5" y="0.5" width="879" height="349" rx="12"/>
<text x="28" y="40" class="ink" font-size="17" text-anchor="start" font-weight="600">One coordinate system: find → read → change → find</text>
<text x="28" y="62" class="ink2" font-size="13" text-anchor="start">Every command speaks the same paths, lines and AST spans, so results chain without re-locating anything.</text>
<rect class="card" x="28" y="86" width="190" height="112" rx="8"/>
<text x="42" y="112" class="ink" font-size="14" text-anchor="start" font-weight="600">Find</text>
<text x="42" y="136" class="ink mono" font-size="11.5" text-anchor="start">lancet 'execute_one'</text>
<text x="42" y="158" class="ink2" font-size="11.5" text-anchor="start">hit at</text>
<text x="42" y="176" class="ink2 mono" font-size="11.5" text-anchor="start">src/search.rs:271</text>
<path class="flowacc" stroke-width="1.6" d="M221,142.0 L237,142.0" marker-end="url(#aha)"/>
<rect class="card" x="240" y="86" width="190" height="112" rx="8"/>
<text x="254" y="112" class="ink" font-size="14" text-anchor="start" font-weight="600">Read</text>
<text x="254" y="136" class="ink mono" font-size="11.5" text-anchor="start">lancet read src/search.rs</text>
<text x="254" y="158" class="ink2 mono" font-size="11.5" text-anchor="start">--lines 260:300</text>
<text x="254" y="176" class="ink2 mono" font-size="11.5" text-anchor="start">or --symbol execute_one</text>
<path class="flowacc" stroke-width="1.6" d="M433,142.0 L449,142.0" marker-end="url(#aha)"/>
<rect class="hl" x="452" y="86" width="190" height="112" rx="8"/>
<text x="466" y="112" class="ink" font-size="14" text-anchor="start" font-weight="600">Change</text>
<text x="466" y="136" class="ink mono" font-size="11.5" text-anchor="start">lancet ast '$X.unwrap()'</text>
<text x="466" y="158" class="ink2 mono" font-size="11.5" text-anchor="start">--rewrite '$X?'</text>
<text x="466" y="176" class="ink2 mono" font-size="11.5" text-anchor="start">dry-run diff → --apply</text>
<path class="flowacc" stroke-width="1.6" d="M645,142.0 L661,142.0" marker-end="url(#aha)"/>
<rect class="card" x="664" y="86" width="190" height="112" rx="8"/>
<text x="678" y="112" class="ink" font-size="14" text-anchor="start" font-weight="600">Find again</text>
<text x="678" y="136" class="ink mono" font-size="11.5" text-anchor="start">lancet 'execute_one'</text>
<text x="678" y="158" class="ink2" font-size="11.5" text-anchor="start">changed file is</text>
<text x="678" y="176" class="ink2 mono" font-size="11.5" text-anchor="start">rescanned (mtime)</text>
<path class="flow" stroke-width="1.4" stroke-dasharray="4 4" fill="none" d="M759.0,202 C759.0,228 123.0,228 123.0,206" marker-end="url(#ah)"/>
<text x="440.0" y="244" class="mut" font-size="12" text-anchor="middle">no reindex step in the loop</text>
<rect class="card" x="28" y="268" width="824" height="52" rx="8"/>
<text x="44" y="290" class="ink" font-size="13" text-anchor="start" font-weight="600">Same in-process extraction everywhere</text>
<text x="44" y="309" class="ink2" font-size="12" text-anchor="start">line 42 in a search hit is line 42 in read — for .rs .py .ts …  .pdf .docx .pptx .xlsx .hwp .hwpx  bundle.zip!node.log</text>
</svg>
