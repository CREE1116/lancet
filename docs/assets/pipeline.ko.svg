<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 392" width="920" height="392" role="img" aria-labelledby="title desc">
<title id="title">인덱스 쿼리가 작업의 91%를 건너뛰고도 정확한 이유</title>
<desc id="desc">Linux v6.12 · 파일 86,218개 · "spin_lock" 쿼리 (auto 모드)</desc>
<style>
