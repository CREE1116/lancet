<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head" d="M0,1 L10,5 L0,9 z"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="headacc" d="M0,1 L10,5 L0,9 z"/></marker>
</defs>
<rect class="panel" x="0.5" y="0.5" width="919" height="391" rx="12"/>
<text x="28.0" y="36.0" class="ink" font-size="17.5" text-anchor="start" font-weight="700">인덱스 쿼리가 작업의 91%를 건너뛰고도 정확한 이유</text>
<text x="28.0" y="58.0" class="ink2" font-size="12.5" text-anchor="start">Linux v6.12 · 파일 86,218개 · "spin_lock" 쿼리 (auto 모드)</text>
<rect class="card" x="28.0" y="82.0" width="201.0" height="112.0" rx="9"/>
<text x="42.0" y="109.0" class="ink" font-size="14" text-anchor="start" font-weight="700">1  컴파일</text>
<text x="42.0" y="134.0" class="ink2" font-size="12" text-anchor="start">"spin_lock" → 필수</text>
<text x="42.0" y="153.0" class="ink2" font-size="12" text-anchor="start">트라이그램: spi ∧ pin</text>
<text x="42.0" y="172.0" class="ink2" font-size="12" text-anchor="start">∧ … ∧ ock (보수적 하한)</text>
<path class="flow" stroke-width="1.6" d="M232.0,138.0 L246.0,138.0" marker-end="url(#ah)"/>
<rect class="card" x="249.0" y="82.0" width="201.0" height="112.0" rx="9"/>
<text x="263.0" y="109.0" class="ink" font-size="14" text-anchor="start" font-weight="700">2  교집합</text>
<text x="263.0" y="134.0" class="ink2" font-size="12" text-anchor="start">mmap .lancet 세그먼트</text>
<text x="263.0" y="153.0" class="ink2" font-size="12" text-anchor="start">가장 드문 포스팅부터</text>
<text x="263.0" y="172.0" class="ink2" font-size="12" text-anchor="start">교집합 → 후보 파일</text>
<path class="flow" stroke-width="1.6" d="M453.0,138.0 L467.0,138.0" marker-end="url(#ah)"/>
<rect class="card" x="470.0" y="82.0" width="201.0" height="112.0" rx="9"/>
<text x="484.0" y="109.0" class="ink" font-size="14" text-anchor="start" font-weight="700">3  신선도 확인</text>
<text x="484.0" y="134.0" class="ink2" font-size="12" text-anchor="start">mtime·size·ctime·inode</text>
<text x="484.0" y="153.0" class="ink2" font-size="12" text-anchor="start">달라진 파일만 즉시 스캔</text>
<text x="484.0" y="172.0" class="ink2" font-size="12" text-anchor="start">데몬·재인덱싱 없음</text>
<path class="flow" stroke-width="1.6" d="M674.0,138.0 L688.0,138.0" marker-end="url(#ah)"/>
<rect class="hl" x="691.0" y="82.0" width="201.0" height="112.0" rx="9"/>
<text x="705.0" y="109.0" class="cblue" font-size="14" text-anchor="start" font-weight="700">4  정확한 검증</text>
<text x="705.0" y="134.0" class="ink2" font-size="12" text-anchor="start">풀스캔과 같은 평가기로</text>
<text x="705.0" y="153.0" class="ink2" font-size="12" text-anchor="start">남은 모든 후보 파일을</text>
<text x="705.0" y="172.0" class="ink2" font-size="12" text-anchor="start">바이트 단위로 검증</text>
<rect class="f0" x="28" y="228" width="530.0" height="26" rx="4"/>
<text x="570.0" y="246.0" class="ink num" font-size="14" text-anchor="start" font-weight="700">86,218</text>
<text x="638.0" y="246.0" class="ink2" font-size="12.5" text-anchor="start">저장소 전체 파일</text>
<rect class="f1" x="28" y="266" width="48.0" height="26" rx="4"/>
<text x="88.0" y="284.0" class="ink num" font-size="14" text-anchor="start" font-weight="700">7,814</text>
<text x="156.0" y="284.0" class="ink2" font-size="12.5" text-anchor="start">열어서 검증한 파일 (9.1%)</text>
<rect class="f2" x="28" y="304" width="43.5" height="26" rx="4"/>
<text x="83.5" y="322.0" class="ink num" font-size="14" text-anchor="start" font-weight="700">7,073</text>
<text x="151.5" y="322.0" class="ink2" font-size="12.5" text-anchor="start">실제 매치된 파일 (8.2%)</text>
<text x="28.0" y="376.0" class="mut" font-size="12" text-anchor="start">출력은 풀스캔(ripgrep)과 바이트 단위로 같습니다 — 인덱스는 '열지 않을 파일'만 결정합니다.</text>
</svg>
