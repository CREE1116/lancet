name: Install test

# Runs the published installers against the latest GitHub Release on every OS we ship.
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [install.sh, install.ps1, .github/workflows/install-test.yml]

jobs:
  unix:
    name: install.sh (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-x86_64, os: ubuntu-latest, container: "" }
          - { name: ubuntu-aarch64, os: ubuntu-24.04-arm, container: "" }
          - { name: macos-arm64, os: macos-latest, container: "" }
          - { name: ubuntu-20.04-glibc-2.31, os: ubuntu-latest, container: "ubuntu:20.04" }
          - { name: alpine, os: ubuntu-latest, container: "alpine:3" }
    steps:
      - name: Prepare container
        if: matrix.container != ''
        run: |
          if command -v apk >/dev/null; then apk add --no-cache curl tar
          else apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates >/dev/null; fi
      - uses: actions/checkout@v4
      - name: Install
        run: LANCET_INSTALL_DIR="$PWD/bin" sh install.sh
      - name: Smoke test
        run: |
          ./bin/lancet --version
          if command -v file >/dev/null; then file ./bin/lancet; fi
          ./bin/lancet rg -c LANCET_INSTALL_DIR install.sh

  windows:
    name: install.ps1 (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        shell: pwsh
        run: |
          $env:LANCET_INSTALL_DIR = "$PWD\bin"
          ./install.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          ./bin/lancet.exe --version
          ./bin/lancet.exe rg -c LANCET_INSTALL_DIR install.ps1

  musl-vs-gnu:
    name: musl vs gnu speed (ubuntu-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install both builds
        run: |
          LANCET_LIBC=gnu LANCET_INSTALL_DIR="$PWD/gnu" sh install.sh
          LANCET_LIBC=musl LANCET_INSTALL_DIR="$PWD/musl" sh install.sh
      - name: Same output, compare wall time (no index, all CPUs)
        run: |
          sudo apt-get install -y -qq hyperfine >/dev/null
          for p in 'static' '[A-Z][a-z]+Error' 'fn\s+\w+\('; do
            gnu/lancet rg --no-index -c "$p" /usr/include /usr/share | sort > g.txt || true
            musl/lancet rg --no-index -c "$p" /usr/include /usr/share | sort > m.txt || true
            cmp g.txt m.txt
          done
          hyperfine -N -w 2 -r 10 --export-markdown t.md \
            "gnu/lancet rg --no-index -c static /usr/include /usr/share" \
            "musl/lancet rg --no-index -c static /usr/include /usr/share" \
            "gnu/lancet rg --no-index -c [A-Z][a-z]+Error /usr/include /usr/share" \
            "musl/lancet rg --no-index -c [A-Z][a-z]+Error /usr/include /usr/share"
          cat t.md >> "$GITHUB_STEP_SUMMARY"
