name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            archive: tgz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            archive: tgz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: ""
            archive: tgz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: ""
            archive: tgz
          # Static builds: run on Alpine and on distros whose glibc is older than the build host's.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            archive: tgz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            ext: ""
            archive: tgz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the musl binary is static
        if: endsWith(matrix.target, '-musl')
        run: |
          file "target/${{ matrix.target }}/release/lancet"
          file "target/${{ matrix.target }}/release/lancet" | grep -Eq 'static(-pie|ally) linked'

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          mkdir -p dist artifacts
          cp "target/${{ matrix.target }}/release/lancet" dist/lancet
          strip dist/lancet || true
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          tar -czf "artifacts/lancet-${TAG}-${{ matrix.target }}.tar.gz" -C dist .

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag }}" -ne "") {
            $tag = "${{ inputs.tag }}"
          }
          New-Item -ItemType Directory -Force -Path dist, artifacts | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lancet.exe" "dist/lancet.exe"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/
          Compress-Archive -Path "dist/*" -DestinationPath "artifacts/lancet-$tag-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: lancet-${{ matrix.target }}
          path: artifacts/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum lancet-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/lancet-*
            dist/SHA256SUMS.txt
