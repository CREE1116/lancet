name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (strict)
        run: cargo clippy --all-targets -- -D warnings
      - name: Minimal pure-core check (no default features)
        run: cargo check --no-default-features
      - name: Run unit & integration tests
        run: cargo test --release

  rg-parity:
    name: ripgrep parity (ripgrep 16.0.0, byte for byte)
    runs-on: ubuntu-latest
    env:
      RG_VERSION: 16.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build lancet
        run: cargo build --release
      - name: Install ripgrep ${{ env.RG_VERSION }}
        run: |
          base="ripgrep-$RG_VERSION-x86_64-unknown-linux-musl"
          url="https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/$base.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$base.tar.gz" "$url"
          curl -fsSL -o "$base.tar.gz.sha256" "$url.sha256"
          sha256sum -c "$base.tar.gz.sha256"
          tar -xzf "$base.tar.gz"
          echo "RG_BIN=$RUNNER_TEMP/$base/rg" >> "$GITHUB_ENV"
      - name: Compare stdout and exit codes on the fixture
        run: python3 bench/rg_parity.py --rg "$RG_BIN"
